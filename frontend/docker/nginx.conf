server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving via a variable (below) instead of a
    # bare hostname in proxy_pass means nginx re-resolves "backend" on this
    # TTL instead of caching whatever IP it had at worker startup -- without
    # this, recreating the backend container (a deploy, a restart) leaves
    # nginx pointing at a dead IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # $http_host (not $host) so the original port survives the proxy --
        # nginx's $host always strips the port, which made Django build
        # media/absolute URLs pointing at the wrong port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /media/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (Swagger UI assets, etc.) -- the Operations
    # Portal and storefront never use these, but /api/docs/ does.
    location /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Versioned, hashed build assets: cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never cache the HTML shell so deploys are picked up immediately, and
    # let the same SPA handle both the storefront and /operations/* routes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
