name: ekas

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Kolkata}
  SITE_NAME: ${SITE_NAME:-EKAS Healthy Foods}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}

  DB_HOST: postgres
  DB_PORT: 5432
  DATABASE_URL: postgres://${POSTGRES_USER:-ekas}:${POSTGRES_PASSWORD:-ekas}@postgres:5432/${POSTGRES_DB:-ekas}

  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}

  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-False}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-Lax}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
  LOGIN_LOCKOUT_ATTEMPTS: ${LOGIN_LOCKOUT_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}

  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-EKAS Healthy Foods <no-reply@ekashealthyfoods.local>}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}

  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

  SHIPPING_PROVIDER: ${SHIPPING_PROVIDER:-mock}
  SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL:-}
  SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD:-}
  FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-999}
  FLAT_SHIPPING_FEE: ${FLAT_SHIPPING_FEE:-79}
  COD_ENABLED: ${COD_ENABLED:-True}
  DEFAULT_TAX_RATE_PERCENT: ${DEFAULT_TAX_RATE_PERCENT:-5.0}
  RESERVATION_EXPIRY_MINUTES: ${RESERVATION_EXPIRY_MINUTES:-20}

  OPERATIONS_ADMIN_EMAIL: ${OPERATIONS_ADMIN_EMAIL:-}
  OPERATIONS_ADMIN_PASSWORD: ${OPERATIONS_ADMIN_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MEDIA_ROOT: /app/media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekas}
      POSTGRES_DB: ${POSTGRES_DB:-ekas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekas} -d ${POSTGRES_DB:-ekas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: 992382653273.dkr.ecr.ap-south-1.amazonaws.com/triode/clinoscare:backend-${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    restart: "no"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             if [ -n \"$$OPERATIONS_ADMIN_EMAIL\" ] && [ -n \"$$OPERATIONS_ADMIN_PASSWORD\" ]; then
               python manage.py create_operations_admin --noinput;
             fi"

  backend:
    image: 992382653273.dkr.ecr.ap-south-1.amazonaws.com/triode/clinoscare:backend-${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    restart: unless-stopped
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    image: 992382653273.dkr.ecr.ap-south-1.amazonaws.com/triode/clinoscare:backend-${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-beat:
    image: 992382653273.dkr.ecr.ap-south-1.amazonaws.com/triode/clinoscare:backend-${IMAGE_TAG:-latest}
    environment:
      <<: *backend-env
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: 992382653273.dkr.ecr.ap-south-1.amazonaws.com/triode/clinoscare:frontend-${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  media_data:
